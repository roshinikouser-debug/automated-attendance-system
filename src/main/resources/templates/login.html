<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AutoSystem Academy</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="main-container">
        <div class="row align-items-center justify-content-center min-vh-100">
            <div class="col-md-6 col-lg-4">
                <div class="glass-card shadow-pro">
                    <div class="text-center mb-5">
                        <div class="mx-auto mb-4 d-flex align-items-center justify-content-center" 
                             style="width: 72px; height: 72px; font-size: 2rem; border-radius: 20px; background: linear-gradient(135deg, var(--brand-primary), #6366f1); color: #fff; box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);">
                            <i class="fa fa-fingerprint"></i>
                        </div>
                        <h1 class="h3 mb-2 fw-800 text-gradient">Academy Access</h1>
                        <p class="text-muted small">Sign in to your secure biometric workspace.</p>
                    </div>

                    <form th:action="@{/login}" method="POST">
                        <div class="mb-3">
                            <label class="label-caps small">Academic Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px; border-color: #e2e8f0; color: #94a3b8;"><i class="fa fa-envelope"></i></span>
                                <input type="email" class="form-control border-start-0 py-2" name="email" placeholder="name@academy.edu" required style="border-radius: 0 12px 12px 0; border-color: #e2e8f0;">
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between">
                                <label class="label-caps small">Security Pass</label>
                                <a th:href="@{/forgot_password}" class="text-muted small text-decoration-none" style="font-size: 0.7rem;">Forgot?</a>
                            </div>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0" style="border-radius: 12px 0 0 12px; border-color: #e2e8f0; color: #94a3b8;"><i class="fa fa-lock"></i></span>
                                <input type="password" id="password" class="form-control border-start-0 border-end-0 py-2" name="password" placeholder="••••••••" required style="border-color: #e2e8f0;">
                                <span class="input-group-text bg-white border-start-0 text-muted" style="cursor: pointer; border-radius: 0 12px 12px 0; border-color: #e2e8f0;" onclick="togglePassword()">
                                    <i class="fa fa-eye" id="eyeIcon"></i>
                                </span>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="label-caps small">Academy Role</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="role" id="role_student" value="student" required checked>
                                    <label class="btn btn-outline-secondary w-100 border-dashed py-2" for="role_student" style="border-radius: 12px; font-size: 0.8rem;">
                                        <i class="fa fa-user-graduate d-block mb-1"></i> Student
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="role" id="role_faculty" value="faculty" required>
                                    <label class="btn btn-outline-secondary w-100 border-dashed py-2" for="role_faculty" style="border-radius: 12px; font-size: 0.8rem;">
                                        <i class="fa fa-chalkboard-user d-block mb-1"></i> Faculty
                                    </label>
                                </div>
                            </div>
                        </div>

                        <button class="btn btn-zen w-100 py-3 shadow mb-3">
                            Sign In to Portal <i class="fa fa-arrow-right-long ms-2"></i>
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="text-muted small mb-0">First time in the academy? <a th:href="@{/register}" class="text-brand-primary fw-bold text-decoration-none">Enroll Now</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script th:inline="javascript">
        function togglePassword() {
            let password = document.getElementById("password");
            let icon = document.getElementById("eyeIcon");
            if (password.type === "password") {
                password.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                password.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
        document.addEventListener("DOMContentLoaded", function () {
            let errorMsg = /*[[${error}]]*/ null;
            let successMsg = /*[[${success}]]*/ null;
            function showToast(text, bg) {
                if (!text) return;
                Toastify({ text: text, duration: 4000, close: true, gravity: "top", position: "right", style: { background: bg, borderRadius: "10px", padding: "12px 20px", color: "#fff" } }).showToast();
            }
            if (errorMsg) showToast(errorMsg, "linear-gradient(to right, #f43f5e, #e11d48)");
            if (successMsg) showToast(successMsg, "linear-gradient(to right, #10b981, #059669)");
        });
    </script>
</body>
</html>
