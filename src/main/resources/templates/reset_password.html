<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="main-container">
        <div class="glass-card mx-auto" style="max-width: 450px; width: 100%;">
            <div class="text-center mb-5">
                <div class="mx-auto mb-4 d-flex align-items-center justify-content-center" 
                     style="width: 80px; height: 80px; font-size: 2.5rem; border-radius: 24px; background: rgba(16, 185, 129, 0.1); color: var(--brand-success); border: 1px solid rgba(16, 185, 129, 0.2);">
                    <i class="fa fa-key"></i>
                </div>
                <h1 class="h2 mb-2 text-gradient">New Password</h1>
                <p class="text-muted">Create a secure new password.</p>
            </div>

            <form th:action="@{'/reset_password/' + ${token}}" method="POST">
                <div class="mb-3">
                    <label class="label-caps">New Security Pass</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted" style="border-radius: 12px 0 0 12px; border-color: #e2e8f0;"><i class="fa fa-lock"></i></span>
                        <input type="password" id="password" class="form-control border-start-0 border-end-0" name="password" placeholder="••••••••" required minlength="6" style="background: #fff; border-color: #e2e8f0; color: var(--text-main);">
                        <span class="input-group-text bg-white border-start-0 text-muted toggle-password" style="cursor: pointer; border-radius: 0 12px 12px 0; border-color: #e2e8f0;" onclick="togglePassword('password', 'eyeIcon1')">
                            <i class="fa fa-eye" id="eyeIcon1"></i>
                        </span>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="label-caps">Confirm Security Pass</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted" style="border-radius: 12px 0 0 12px; border-color: #e2e8f0;"><i class="fa fa-lock"></i></span>
                        <input type="password" id="confirm_password" class="form-control border-start-0 border-end-0" name="confirm_password" placeholder="••••••••" required minlength="6" style="background: #fff; border-color: #e2e8f0; color: var(--text-main);">
                        <span class="input-group-text bg-white border-start-0 text-muted toggle-password" style="cursor: pointer; border-radius: 0 12px 12px 0; border-color: #e2e8f0;" onclick="togglePassword('confirm_password', 'eyeIcon2')">
                            <i class="fa fa-eye" id="eyeIcon2"></i>
                        </span>
                    </div>
                </div>

                <button class="btn btn-zen w-100 py-3 shadow-lg mb-3">
                    Update Password <i class="fa fa-check ms-2"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script th:inline="javascript">
        function togglePassword(inputId, iconId) {
            let password = document.getElementById(inputId);
            let icon = document.getElementById(iconId);
            if (password.type === "password") {
                password.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                password.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
        document.addEventListener("DOMContentLoaded", function () {
            let errorMsg = /*[[${error}]]*/ null;
            let successMsg = /*[[${success}]]*/ null;
            function showToast(text, bg) {
                if (!text) return;
                Toastify({ text: text, duration: 4000, close: true, gravity: "top", position: "right", style: { background: bg, borderRadius: "10px", padding: "12px 20px", color: "#fff" } }).showToast();
            }
            if (errorMsg) showToast(errorMsg, "linear-gradient(to right, #f43f5e, #e11d48)");
            if (successMsg) showToast(successMsg, "linear-gradient(to right, #10b981, #059669)");
        });
    </script>
</body>
</html>
