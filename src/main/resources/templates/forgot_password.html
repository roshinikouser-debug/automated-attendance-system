<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Attendance System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <div class="blob-container">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <div class="main-container">
        <div class="glass-card mx-auto" style="max-width: 450px; width: 100%;">
            <div class="text-center mb-5">
                <div class="mx-auto mb-4 d-flex align-items-center justify-content-center" 
                     style="width: 80px; height: 80px; font-size: 2.5rem; border-radius: 24px; background: rgba(79, 70, 229, 0.1); color: var(--brand-primary); border: 1px solid rgba(79, 70, 229, 0.2);">
                    <i class="fa fa-unlock-keyhole"></i>
                </div>
                <h1 class="h2 mb-2 text-gradient">Reset Access</h1>
                <p class="text-muted">Enter your details to receive a reset link.</p>
            </div>

            <form th:action="@{/forgot_password}" method="POST">
                <div class="mb-3">
                    <label class="label-caps">Email Identity</label>
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0 text-muted" style="border-radius: 12px 0 0 12px; border-color: #e2e8f0;"><i class="fa fa-envelope"></i></span>
                        <input type="email" class="form-control border-start-0" name="email" placeholder="name@school.com" required style="border-radius: 0 12px 12px 0; background: #fff; border-color: #e2e8f0; color: var(--text-main);">
                    </div>
                </div>

                <div class="mb-4">
                    <label class="label-caps">Academy Role</label>
                    <select class="form-select" name="role" required style="border-radius: 12px; background: #fff; border-color: #e2e8f0; color: var(--text-main); padding: 0.85rem 1.25rem;">
                        <option value="" disabled selected>Select your role...</option>
                        <option value="student">Student Explorer</option>
                        <option value="faculty">Faculty Leader</option>
                    </select>
                </div>

                <button class="btn btn-zen w-100 py-3 shadow-lg mb-3">
                    Send Reset Link <i class="fa fa-paper-plane ms-2"></i>
                </button>
            </form>

            <div class="text-center mt-4 pt-4 border-top border-white border-opacity-5">
                <p class="text-muted small">Remembered your password? <a th:href="@{/}" class="text-gradient fw-bold text-decoration-none">Back to Login</a></p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script th:inline="javascript">
        document.addEventListener("DOMContentLoaded", function () {
            let errorMsg = /*[[${error}]]*/ null;
            let successMsg = /*[[${success}]]*/ null;
            function showToast(text, bg) {
                if (!text) return;
                Toastify({ text: text, duration: 4000, close: true, gravity: "top", position: "right", style: { background: bg, borderRadius: "10px", padding: "12px 20px", color: "#fff" } }).showToast();
            }
            if (errorMsg) showToast(errorMsg, "linear-gradient(to right, #f43f5e, #e11d48)");
            if (successMsg) showToast(successMsg, "linear-gradient(to right, #10b981, #059669)");
        });
    </script>
</body>
</html>
